name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly full-CI run including the strict-timing contract pass; odd
    # minute to avoid the top-of-hour runner stampede.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned module toolchain (go-version-file) plus the previous Go
        # release: proves a consumer whose checkout machine runs one release
        # behind can still build and test the module (the toolchain directive
        # in go.mod bootstraps the pinned toolchain via GOTOOLCHAIN=auto).
        go-version: ["go.mod", "oldstable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version != 'go.mod' && matrix.go-version || '' }}
          go-version-file: ${{ matrix.go-version == 'go.mod' && 'go.mod' || '' }}

      - name: Run tests with race detector
        run: go test ./... -race -count=1

      - name: Strict-timing contract pass (scheduled)
        if: github.event_name == 'schedule'
        run: go test ./contract -race -count=1 -run TestRunTestsStrict_ScaledTimings
        env:
          GO_IDEMPOTENCY_CONTRACT_TIMING_SCALE: "3"

      - name: Run tests with coverage
        if: matrix.go-version == 'go.mod'
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Print coverage summary
        if: matrix.go-version == 'go.mod'
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        if: matrix.go-version == 'go.mod'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != '' && matrix.go-version == 'go.mod'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go mod tidy produces no diff
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  fuzz:
    name: Fuzz (3m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fuzz CheckAndRecord
        run: go test -fuzz=FuzzCheckAndRecord -fuzztime=3m -run '^$' .

      - name: Fuzz Record
        run: go test -fuzz=FuzzRecord -fuzztime=3m -run '^$' .

      - name: Fuzz ConcurrentMixed
        run: go test -fuzz=FuzzConcurrentMixed -fuzztime=3m -run '^$' .

      - name: Fuzz Dispatch
        run: go test -fuzz=FuzzDispatch -fuzztime=3m -run '^$' ./middleware

  govulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check living docs for stale references
        run: ./scripts/check-stale-refs.sh

      - name: Check links
        # Fragment anchors are not verified (lychee default): pkg.go.dev
        # #hdr-... anchors do not resolve as HTTP fragments. Historical
        # snapshots (feedback, status reports, planning docs) are excluded
        # with the same policy as check-stale-refs: they record what was
        # true at the time and may link to private repositories the CI token
        # cannot see or to paths that later moved (e.g. archived plans).
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3
            --exclude-path docs/feedback
            --exclude-path docs/status
            --exclude-path docs/planning
            .
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
